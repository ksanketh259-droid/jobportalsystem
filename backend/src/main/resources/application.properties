
# Server Configuration
server.port=8080

# Application Name
spring.application.name=jobportal

# Database Configuration (Persistent file-based H2)
spring.datasource.url=jdbc:h2:file:./data/jobportaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Uploads Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jobportal.jwt.secret=JobPortalSystemSuperSecretKeyWithAtLeast256BitsForSecurityPurposeOnly2026!
jobportal.jwt.expiration-ms=86400000
